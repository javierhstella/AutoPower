<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>AutoPower • Spectrum</title>

<style>
  :root{
    --bg:#05080b;
    --panel:#091017;
    --text:#e9fbff;
    --muted:#7f98a3;
    --cyan:#00e5ff;
    --amber:#ffb000;
    --red:#ff4050;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }

  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
  }

  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }

  .title{
    font-size:18px;
    font-weight:800;
    letter-spacing:.14em;
  }

  .subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.10em;
  }

  .live{
    border:1px solid rgba(0,229,255,.35);
    border-radius:999px;
    padding:6px 9px;
    font-size:10px;
    color:#7d919a;
    white-space:nowrap;
  }

  .live.on{
    color:var(--cyan);
    box-shadow:0 0 16px rgba(0,229,255,.15);
  }

  .meter{
    flex:1;
    min-height:330px;
    position:relative;
    display:flex;
    align-items:stretch;
    gap:clamp(3px,1vw,8px);
    padding:14px 6px 6px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    background:
      radial-gradient(circle at 50% 100%,rgba(0,229,255,.06),transparent 45%),
      linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.005));
    overflow:hidden;
  }

  .band{
    flex:1 1 0;
    min-width:0;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .track{
    flex:1;
    width:100%;
    min-height:220px;
    position:relative;
    overflow:hidden;
    border-radius:5px;
    opacity:.96;
  }

  /* Una sola capa gráfica por barra.
     El patrón de segmentos se hace por máscara CSS:
     muchísimo más liviano que 20 DIVs por banda. */
  .fill{
    position:absolute;
    inset:0;
    transform-origin:50% 100%;
    transform:scaleY(.001);
    will-change:transform;
    background:
      linear-gradient(
        to top,
        var(--cyan) 0%,
        var(--cyan) 70%,
        var(--amber) 70%,
        var(--amber) 88%,
        var(--red) 88%,
        var(--red) 100%
      );
    -webkit-mask-image:
      repeating-linear-gradient(
        to top,
        #000 0px,
        #000 8px,
        transparent 8px,
        transparent 11px
      );
    mask-image:
      repeating-linear-gradient(
        to top,
        #000 0px,
        #000 8px,
        transparent 8px,
        transparent 11px
      );
    filter:drop-shadow(0 0 5px rgba(0,229,255,.30));
  }

  .peak{
    position:absolute;
    left:0;
    right:0;
    bottom:0%;
    height:3px;
    border-radius:4px;
    background:#dfffff;
    box-shadow:0 0 8px rgba(210,255,255,.8);
    opacity:0;
    will-change:bottom,opacity;
  }

  .freq{
    height:26px;
    padding-top:8px;
    color:#87a0aa;
    font-size:clamp(8px,2.2vw,11px);
    text-align:center;
    white-space:nowrap;
  }

  .readout{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:10px;
    margin-top:10px;
  }

  .db{
    font-size:clamp(26px,8vw,48px);
    font-weight:900;
    letter-spacing:-.04em;
    line-height:1;
  }

  .meta{
    text-align:right;
    color:var(--muted);
    font-size:10px;
    line-height:1.45;
  }

  .controls{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
  }

  .sensBox{
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.08);
    background:var(--panel);
    border-radius:14px;
  }

  .sensHead{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:7px;
    font-size:10px;
    color:var(--muted);
    letter-spacing:.06em;
  }

  .sensValue{
    color:var(--cyan);
    font-weight:700;
  }

  input[type="range"]{
    width:100%;
    accent-color:var(--cyan);
  }

  button{
    border:0;
    border-radius:14px;
    padding:14px 15px;
    font-weight:800;
    letter-spacing:.04em;
    cursor:pointer;
  }

  #espBtn{
    background:#10232b;
    color:#c9faff;
    border:1px solid rgba(0,229,255,.22);
    height:100%;
  }

  .startOverlay{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(2,5,8,.94);
    backdrop-filter:blur(7px);
  }

  .startOverlay.hidden{
    display:none;
  }

  .card{
    width:min(420px,100%);
    padding:24px;
    border:1px solid rgba(0,229,255,.22);
    background:#081017;
    border-radius:22px;
    box-shadow:0 22px 80px rgba(0,0,0,.5);
    text-align:center;
  }

  .card h1{
    margin:0 0 8px;
    font-size:22px;
  }

  .card p{
    margin:0 0 18px;
    color:#8aa1aa;
    font-size:13px;
    line-height:1.45;
  }

  #startBtn{
    width:100%;
    background:var(--cyan);
    color:#001318;
    font-size:14px;
  }

  .error{
    min-height:18px;
    margin-top:12px;
    color:#ff7480;
    font-size:11px;
    white-space:pre-wrap;
  }

  @media (max-width:520px){
    .page{ padding-left:8px; padding-right:8px; }
    .meter{ gap:2px; padding-left:4px; padding-right:4px; border-radius:14px; }
    .freq{ font-size:8px; }
    .controls{ grid-template-columns:1fr; }
    #espBtn{ min-height:48px; }
  }
</style>
</head>

<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">LEVEL ANALYZER</div>
      <div class="subtitle">MICROPHONE • REAL-TIME FFT</div>
    </div>
    <div id="live" class="live">MIC • OFF</div>
  </div>

  <div id="meter" class="meter"></div>

  <div class="readout">
    <div id="db" class="db">— dBFS</div>
    <div class="meta">
      <div id="peakText">PEAK: —</div>
      <div id="sourceText">SOURCE: MIC</div>
      <div id="fpsText">ANALYZER: READY</div>
    </div>
  </div>

  <div class="controls">
    <div class="sensBox">
      <div class="sensHead">
        <span>SENSIBILIDAD VISUAL</span>
        <span id="sensValue" class="sensValue">+24 dB</span>
      </div>
      <input id="sens" type="range" min="0" max="42" step="1" value="24">
    </div>

    <button id="espBtn" type="button">CONTROL ESP</button>
  </div>
</div>

<div id="overlay" class="startOverlay">
  <div class="card">
    <h1>AutoPower Spectrum</h1>
    <p>
      Esta versión está optimizada para celular:
      menos carga de CPU, barras por GPU y sensibilidad ajustable.
    </p>
    <button id="startBtn" type="button">ACTIVAR MICRÓFONO</button>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
// ============================================================================
// AUTPOWER MIC SPECTRUM v3 MOBILE
// ----------------------------------------------------------------------------
// OBJETIVO:
// - Mantener el aspecto de analizador segmentado.
// - Reducir drásticamente la carga gráfica en celulares.
// - Mejorar la sensibilidad sin agregar trabajo al ESP8266.
// - Permitir ajustar la sensibilidad desde el propio teléfono.
//
// CAMBIO CLAVE:
// La versión anterior dibujaba cientos de elementos DOM por cuadro.
// Esta versión usa UNA capa gráfica por barra y una marca de pico.
// ============================================================================


// ---------------------------------------------------------------------------
// CONFIGURACIÓN
// ---------------------------------------------------------------------------

// Dirección del panel de control del ESP8266.
const CONTROL_URL = 'http://192.168.1.13/control';

// Frecuencias centrales del analizador.
const BANDS = [
  40, 63, 100, 160, 250, 400, 630,
  1000, 1600, 2500, 4000, 6300, 10000, 16000
];

// 4096 es un buen compromiso para teléfono:
// a 48 kHz da ~11,7 Hz/bin y sigue representando bien los graves.
const FFT_SIZE = 4096;

// No necesitamos calcular FFT 60 veces/s.
// 30 FPS se ve fluido y reduce muchísimo CPU/batería.
const ANALYSIS_INTERVAL_MS = 33;

// Piso/techo visuales.
// La sensibilidad adicional la controla el deslizador.
const VISUAL_FLOOR_DB = -86;
const VISUAL_CEILING_DB = -24;

// Compensación visual aproximada de los extremos.
// No es calibración acústica; sólo equilibra la presentación.
const BAND_COMP_DB = [
  12, 9, 6, 3, 1, 0, 0,
   0, 0, 1, 2, 4, 7, 10
];

// Ataque y caída de las barras.
const ATTACK = 0.82;
const RELEASE = 0.23;

// Caída del peak hold.
const PEAK_RELEASE_PER_FRAME = 0.012;


// ---------------------------------------------------------------------------
// REFERENCIAS HTML
// ---------------------------------------------------------------------------

const meter = document.getElementById('meter');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const errorBox = document.getElementById('error');
const live = document.getElementById('live');

const dbText = document.getElementById('db');
const peakText = document.getElementById('peakText');
const sourceText = document.getElementById('sourceText');
const fpsText = document.getElementById('fpsText');

const sens = document.getElementById('sens');
const sensValue = document.getElementById('sensValue');
const espBtn = document.getElementById('espBtn');


// ---------------------------------------------------------------------------
// BARRAS: 14 fills + 14 peak markers.
// ---------------------------------------------------------------------------

const fills = [];
const peakEls = [];

const shown = new Float32Array(BANDS.length);
const peakShown = new Float32Array(BANDS.length);

function formatFreq(hz)
{
  if (hz >= 1000)
  {
    const k = hz / 1000;
    return Number.isInteger(k) ? `${k}k` : `${k.toFixed(1)}k`;
  }

  return String(hz);
}

for (let i = 0; i < BANDS.length; i++)
{
  const band = document.createElement('div');
  band.className = 'band';

  const track = document.createElement('div');
  track.className = 'track';

  const fill = document.createElement('div');
  fill.className = 'fill';

  const peak = document.createElement('div');
  peak.className = 'peak';

  const label = document.createElement('div');
  label.className = 'freq';
  label.textContent = formatFreq(BANDS[i]);

  track.appendChild(fill);
  track.appendChild(peak);

  band.appendChild(track);
  band.appendChild(label);

  meter.appendChild(band);

  fills.push(fill);
  peakEls.push(peak);
}


// ---------------------------------------------------------------------------
// WEB AUDIO
// ---------------------------------------------------------------------------

let ctx = null;
let analyser = null;
let freqData = null;
let timeData = null;

let sampleRate = 48000;

// Rango de bins de cada banda.
// Se calcula UNA sola vez al arrancar.
let bandRanges = [];

let lastAnalysisAt = 0;
let lastFpsAt = performance.now();
let frameCounter = 0;
let measuredFps = 0;

let globalPeakDb = -90;


// ---------------------------------------------------------------------------
// SENSIBILIDAD
// ---------------------------------------------------------------------------

// Recuperamos la sensibilidad elegida anteriormente.
const savedSensitivity = localStorage.getItem('autopowerSensitivity');

if (savedSensitivity !== null)
{
  const value = Number(savedSensitivity);

  if (Number.isFinite(value))
  {
    sens.value = String(Math.max(0, Math.min(42, value)));
  }
}

function currentGainDb()
{
  return Number(sens.value);
}

function refreshSensitivityLabel()
{
  sensValue.textContent = `+${currentGainDb()} dB`;
}

refreshSensitivityLabel();

sens.addEventListener('input', () =>
{
  refreshSensitivityLabel();

  localStorage.setItem(
    'autopowerSensitivity',
    String(currentGainDb())
  );
});


// ---------------------------------------------------------------------------
// UTILIDADES
// ---------------------------------------------------------------------------

function clamp(v, lo, hi)
{
  return Math.max(lo, Math.min(hi, v));
}

function dbToNorm(db)
{
  return clamp(
    (db - VISUAL_FLOOR_DB) /
    (VISUAL_CEILING_DB - VISUAL_FLOOR_DB),
    0,
    1
  );
}


// ---------------------------------------------------------------------------
// PRECALCULAR LOS BINS DE CADA BANDA
// ---------------------------------------------------------------------------

function buildBandRanges()
{
  const binHz = sampleRate / FFT_SIZE;

  bandRanges = BANDS.map((center, i) =>
  {
    const low =
      i === 0
        ? center / Math.sqrt(BANDS[1] / center)
        : Math.sqrt(BANDS[i - 1] * center);

    const high =
      i === BANDS.length - 1
        ? center * Math.sqrt(center / BANDS[i - 1])
        : Math.sqrt(center * BANDS[i + 1]);

    return {
      from: Math.max(1, Math.floor(low / binHz)),
      to: Math.min(
        FFT_SIZE / 2 - 1,
        Math.ceil(high / binHz)
      )
    };
  });
}


// ---------------------------------------------------------------------------
// ACTIVAR MICRÓFONO
// ---------------------------------------------------------------------------

async function startMic()
{
  errorBox.textContent = '';

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  )
  {
    errorBox.textContent =
      'El navegador no habilita el micrófono en este contexto. ' +
      'Abrí la página HTTPS de GitHub Pages.';
    return;
  }

  try
  {
    const stream = await navigator.mediaDevices.getUserMedia(
    {
      audio:
      {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      },
      video: false
    });

    ctx = new (window.AudioContext || window.webkitAudioContext)();

    await ctx.resume();

    sampleRate = ctx.sampleRate;

    const source = ctx.createMediaStreamSource(stream);

    analyser = ctx.createAnalyser();

    analyser.fftSize = FFT_SIZE;

    // Rango dinámico amplio para no perder señales débiles.
    analyser.minDecibels = -110;
    analyser.maxDecibels = -5;

    // Smoothing bajo: queremos respuesta rápida.
    analyser.smoothingTimeConstant = 0.10;

    source.connect(analyser);

    freqData = new Float32Array(analyser.frequencyBinCount);

    // Para RMS no hace falta usar miles de muestras.
    // Este buffer es reutilizado por el navegador.
    timeData = new Float32Array(FFT_SIZE);

    buildBandRanges();

    overlay.classList.add('hidden');

    live.textContent = 'MIC • LIVE';
    live.classList.add('on');

    sourceText.textContent =
      `SOURCE: MIC • ${Math.round(sampleRate / 1000)} kHz`;

    requestAnimationFrame(render);
  }
  catch (err)
  {
    errorBox.textContent =
      'No se pudo abrir el micrófono:\n' +
      (err?.message || String(err));
  }
}


// ---------------------------------------------------------------------------
// ANÁLISIS
// ---------------------------------------------------------------------------

function analyze()
{
  analyser.getFloatFrequencyData(freqData);

  analyser.getFloatTimeDomainData(timeData);

  // RMS y pico general.
  let sumSq = 0;
  let absPeak = 0;

  // Muestreamos 1 de cada 4 valores temporales.
  // Para el indicador general es más que suficiente y ahorra CPU.
  for (let i = 0; i < timeData.length; i += 4)
  {
    const v = timeData[i];

    sumSq += v * v;

    const a = Math.abs(v);

    if (a > absPeak)
    {
      absPeak = a;
    }
  }

  const usedSamples = Math.ceil(timeData.length / 4);

  const rms = Math.sqrt(sumSq / usedSamples);

  const rmsDb =
    rms > 0
      ? Math.max(-100, 20 * Math.log10(rms))
      : -100;

  const instantPeakDb =
    absPeak > 0
      ? Math.max(-100, 20 * Math.log10(absPeak))
      : -100;

  if (instantPeakDb > globalPeakDb)
  {
    globalPeakDb = instantPeakDb;
  }
  else
  {
    globalPeakDb = Math.max(-100, globalPeakDb - 0.20);
  }

  const userGain = currentGainDb();

  // Cada banda recorre únicamente SUS bins precalculados.
  for (let b = 0; b < BANDS.length; b++)
  {
    const range = bandRanges[b];

    let maxDb = -110;

    // Nos quedamos con el pico espectral de la banda.
    // Es ágil, sensible y mucho más barato que recalcular potencia promedio.
    for (let i = range.from; i <= range.to; i++)
    {
      const db = freqData[i];

      if (Number.isFinite(db) && db > maxDb)
      {
        maxDb = db;
      }
    }

    const visualDb =
      maxDb +
      userGain +
      BAND_COMP_DB[b];

    const target = dbToNorm(visualDb);

    const k =
      target > shown[b]
        ? ATTACK
        : RELEASE;

    shown[b] += (target - shown[b]) * k;

    if (shown[b] > peakShown[b])
    {
      peakShown[b] = shown[b];
    }
    else
    {
      peakShown[b] = Math.max(
        0,
        peakShown[b] - PEAK_RELEASE_PER_FRAME
      );
    }

    // TRANSFORM lo procesa muy eficientemente el navegador/GPU.
    fills[b].style.transform =
      `scaleY(${Math.max(.001, shown[b]).toFixed(3)})`;

    peakEls[b].style.bottom =
      `${(peakShown[b] * 100).toFixed(1)}%`;

    peakEls[b].style.opacity =
      peakShown[b] > 0.025 ? '1' : '0';
  }

  dbText.textContent = `${rmsDb.toFixed(1)} dBFS`;

  peakText.textContent = `PEAK: ${globalPeakDb.toFixed(1)} dBFS`;
}


// ---------------------------------------------------------------------------
// LOOP VISUAL
// ---------------------------------------------------------------------------

function render(now)
{
  // requestAnimationFrame mantiene sincronía con la pantalla,
  // pero sólo hacemos la FFT aproximadamente cada 33 ms.
  if (now - lastAnalysisAt >= ANALYSIS_INTERVAL_MS)
  {
    lastAnalysisAt = now;

    analyze();
  }

  frameCounter++;

  if (now - lastFpsAt >= 1000)
  {
    measuredFps =
      Math.round(
        frameCounter * 1000 /
        (now - lastFpsAt)
      );

    fpsText.textContent =
      `DISPLAY: ${measuredFps} FPS • FFT: ~30/s`;

    frameCounter = 0;
    lastFpsAt = now;
  }

  requestAnimationFrame(render);
}


// ---------------------------------------------------------------------------
// EVENTOS
// ---------------------------------------------------------------------------

startBtn.addEventListener('click', startMic);

espBtn.addEventListener('click', () =>
{
  window.location.href = CONTROL_URL;
});
</script>
</body>
</html>
