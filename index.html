<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AutoPower Mic Spectrum</title>
<style>
  :root{
    --bg:#050708;
    --panel:#081013;
    --cyan:#25e8df;
    --cyan-dim:#0c2a2b;
    --amber:#ffad32;
    --red:#ff5138;
    --text:#e9ffff;
    --muted:#6f8488;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--text);font-family:Arial,Helvetica,sans-serif}
  body{user-select:none;touch-action:manipulation}
  .panel{width:100vw;height:100vh;display:flex;flex-direction:column;padding:clamp(12px,2.5vw,30px);background:radial-gradient(circle at 50% 36%,#142126 0,#090d10 48%,#030506 100%)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
  .title{font-size:clamp(22px,4.8vw,50px);font-weight:300;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 18px rgba(37,232,223,.17)}
  .live{font-family:monospace;font-size:clamp(10px,1.8vw,16px);letter-spacing:.12em;color:var(--muted);white-space:nowrap;text-align:right}
  .live.on{color:var(--cyan);text-shadow:0 0 12px rgba(37,232,223,.55)}
  .shell{position:relative;flex:1;min-height:0;border:1px solid #243438;border-radius:18px;padding:clamp(14px,2.4vw,26px) clamp(8px,1.8vw,20px) clamp(18px,2.6vw,28px);background:linear-gradient(180deg,#06090b,#090d10);box-shadow:inset 0 0 36px #000,0 14px 45px rgba(0,0,0,.42)}
  .dbscale{position:absolute;left:4px;top:25px;bottom:35px;width:38px;display:flex;flex-direction:column;justify-content:space-between;color:#63777b;font-family:monospace;font-size:clamp(8px,1.35vw,12px);text-align:right;pointer-events:none}
  .bars{height:100%;margin-left:44px;display:grid;grid-template-columns:repeat(14,1fr);gap:clamp(3px,.8vw,10px);align-items:end}
  .barwrap{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative}
  .bar{height:calc(100% - 22px);display:flex;flex-direction:column-reverse;gap:clamp(2px,.48vh,5px)}
  .seg{flex:1;min-height:2px;border-radius:2px;background:var(--cyan-dim);opacity:.45;box-shadow:inset 0 0 5px rgba(0,0,0,.95);transition:background .025s linear,box-shadow .025s linear,opacity .025s linear}
  .seg.on.cyan{background:var(--cyan);opacity:1;box-shadow:0 0 8px rgba(37,232,223,.68),inset 0 0 3px rgba(255,255,255,.18)}
  .seg.on.amber{background:var(--amber);opacity:1;box-shadow:0 0 9px rgba(255,173,50,.70)}
  .seg.on.red{background:var(--red);opacity:1;box-shadow:0 0 11px rgba(255,81,56,.76)}
  .seg.peak{outline:1px solid rgba(255,255,255,.6);filter:brightness(1.35)}
  .freq{height:20px;display:flex;align-items:flex-end;justify-content:center;color:#5d7276;font-family:monospace;font-size:clamp(7px,1.15vw,11px);white-space:nowrap}
  .footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:10px}
  .metric{font-family:monospace;font-size:clamp(10px,1.8vw,15px);color:#74898d}
  .metric.right{text-align:right}
  .db{font-family:monospace;font-size:clamp(22px,4.7vw,44px);letter-spacing:.04em;color:#dffffc;text-align:center;text-shadow:0 0 14px rgba(37,232,223,.25)}
  .hint{position:absolute;left:50%;bottom:max(4px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(8px,1.2vw,11px);color:#405155;letter-spacing:.11em;white-space:nowrap}
  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,5,6,.92);backdrop-filter:blur(5px)}
  .overlay.hidden{display:none}
  .startbox{max-width:560px;width:100%;padding:28px;border:1px solid #284044;border-radius:18px;background:#071013;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
  .startbox h1{margin:0 0 12px;font-size:clamp(25px,6vw,46px);font-weight:300;letter-spacing:.08em}
  .startbox p{color:#8ba0a4;line-height:1.45;margin:8px 0 20px}
  .startbtn{border:0;border-radius:12px;padding:15px 22px;font-size:18px;font-weight:700;background:var(--cyan);color:#001617;cursor:pointer;box-shadow:0 0 20px rgba(37,232,223,.25)}
  .error{margin-top:15px;color:#ff8d78;font-family:monospace;font-size:13px;white-space:pre-wrap}
  @media (orientation:portrait){
    .panel{padding:12px 7px 16px}.title{font-size:24px}.bars{margin-left:32px;gap:3px}.dbscale{width:27px;left:1px}.freq{font-size:7px}.footer{grid-template-columns:1fr 1fr}.db{grid-column:1/3;grid-row:1}.metric{grid-row:2}
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="top">
    <div class="title">Spectrum Analyzer</div>
    <div id="live" class="live">MICRÓFONO OFF</div>
  </div>

  <div class="shell">
    <div class="dbscale"><span>0</span><span>-6</span><span>-12</span><span>-24</span><span>-36</span><span>-60</span></div>
    <div id="bars" class="bars"></div>
  </div>

  <div class="footer">
    <div id="source" class="metric">SOURCE: MIC</div>
    <div id="db" class="db">-60.0 dBFS</div>
    <div id="status" class="metric right">PEAK: -60.0 dBFS</div>
  </div>

  <div class="hint">TOCAR LA PANTALLA PARA CONTROLES</div>
</div>

<div id="overlay" class="overlay">
  <div class="startbox">
    <h1>MIC SPECTRUM</h1>
    <p>Este visualizador usa únicamente el micrófono del celular o la PC. No agrega carga al ESP8266 ni modifica la automatización.</p>
    <button id="start" class="startbtn">ACTIVAR MICRÓFONO</button>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
// ============================================================================
// AUTPOWER MIC SPECTRUM v2
// ----------------------------------------------------------------------------
// Esta version mejora dos puntos que observamos en la prueba real:
//
// 1) Mayor sensibilidad visual.
// 2) Mejor respuesta en bandas extremas (graves y agudos).
//
// IMPORTANTE:
// El microfono del celular NO es un microfono de medicion. Muchos telefonos
// atenúan deliberadamente graves muy bajos y agudos altos. El software puede
// compensar visualmente esa tendencia, pero no puede recuperar una frecuencia
// que el propio microfono elimine por completo.
// ============================================================================


// ============================================================================
// CONFIGURACION GENERAL
// ============================================================================

// Pagina de control del ESP8266.
const CONTROL_URL = 'http://192.168.1.13/control';

// Frecuencias centrales mostradas.
const BANDS = [
  40, 63, 100, 160, 250, 400, 630,
  1000, 1600, 2500, 4000, 6300, 10000, 16000
];

// Cantidad de segmentos verticales.
const SEGMENTS = 20;

// Ataque alto = subida muy rapida.
const ATTACK = 0.88;

// Caida moderada para que siga siendo agradable visualmente.
const RELEASE = 0.22;

// Caida de la marca de pico.
const PEAK_RELEASE = 0.010;

// Piso y techo VISUALES del analizador.
// Cuanto mas bajo el piso, mas sensibles se vuelven las barras.
const VISUAL_FLOOR_DB = -82;

// El techo no se coloca en 0 dBFS porque un microfono de celular
// normalmente trabaja muy por debajo de ese nivel.
const VISUAL_CEILING_DB = -20;

// Ganancia VISUAL general.
// No modifica el audio ni puede producir clipping del microfono.
// Solamente desplaza hacia arriba lo que dibujamos.
const GLOBAL_VISUAL_GAIN_DB = 16;

// Compensacion aproximada por banda.
//
// Los telefonos suelen atenuar bastante los extremos del espectro.
// Damos mas ayuda a 40/63 Hz y a 10/16 kHz.
//
// Esto NO pretende convertir el celular en un instrumento calibrado.
// Solo busca una visualizacion musicalmente mas equilibrada.
const BAND_COMPENSATION_DB = [
  14, 10, 7, 4, 2, 1, 0,
   0,  0, 1, 2, 4, 7, 11
];

// Si el RMS cae por debajo de este nivel consideramos que estamos
// practicamente en silencio y evitamos levantar puro ruido ambiente.
const SILENCE_GATE_DB = -64;


// ============================================================================
// CONSTRUCCION DE LAS BARRAS
// ============================================================================

const barsRoot = document.getElementById('bars');

const barSegments = [];

const shown = new Array(BANDS.length).fill(0);

const targets = new Array(BANDS.length).fill(0);

const peaks = new Array(BANDS.length).fill(0);


function labelFreq(f)
{
  if (f >= 1000)
  {
    const k = f / 1000;

    return (Number.isInteger(k) ? k : k.toFixed(1)) + 'k';
  }

  return String(f);
}


for (let b = 0; b < BANDS.length; b++)
{
  const wrap = document.createElement('div');

  wrap.className = 'barwrap';


  const col = document.createElement('div');

  col.className = 'bar';


  const segs = [];


  for (let s = 0; s < SEGMENTS; s++)
  {
    const el = document.createElement('div');

    el.className = 'seg';

    col.appendChild(el);

    segs.push(el);
  }


  const freq = document.createElement('div');

  freq.className = 'freq';

  freq.textContent = labelFreq(BANDS[b]);


  wrap.appendChild(col);

  wrap.appendChild(freq);

  barsRoot.appendChild(wrap);

  barSegments.push(segs);
}


// ============================================================================
// WEB AUDIO API
// ============================================================================

let audioContext = null;

let analyser = null;

// Esta vez usamos FLOAT en frecuencia.
// Así trabajamos directamente en dB y ganamos mucha mas informacion
// en señales debiles que con Uint8.
let freqData = null;

let timeData = null;

let sampleRate = 48000;

let micActive = false;

let activatedAt = 0;

let globalPeakDb = -90;


const overlay = document.getElementById('overlay');

const errorBox = document.getElementById('error');

const live = document.getElementById('live');


function clamp(v, a, b)
{
  return Math.max(a, Math.min(b, v));
}


// ============================================================================
// BORDES DE CADA BANDA
// ============================================================================
//
// Usamos medias geometricas entre centros consecutivos.
// Es una forma natural de dividir un espectro logaritmico.
//
function bandEdges(index)
{
  const center = BANDS[index];

  const low =
    index === 0
      ? center / Math.sqrt(BANDS[1] / center)
      : Math.sqrt(BANDS[index - 1] * center);

  const high =
    index === BANDS.length - 1
      ? center * Math.sqrt(center / BANDS[index - 1])
      : Math.sqrt(center * BANDS[index + 1]);

  return [low, high];
}


// ============================================================================
// dB A NIVEL VISUAL 0..1
// ============================================================================

function dbToNorm(db)
{
  return clamp(
    (db - VISUAL_FLOOR_DB) /
    (VISUAL_CEILING_DB - VISUAL_FLOOR_DB),
    0,
    1
  );
}


// ============================================================================
// ARRANQUE DEL MICROFONO
// ============================================================================

async function startMic()
{
  errorBox.textContent = '';


  // getUserMedia necesita contexto seguro.
  if (
    !window.isSecureContext ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  )
  {
    errorBox.textContent =
      'El navegador no permite micrófono en este contexto.\n' +
      'Abrí este archivo HTML directamente o mediante HTTPS.';

    return;
  }


  try
  {
    // Pedimos audio sin los filtros de voz siempre que el navegador
    // respete estas preferencias.
    //
    // autoGainControl queda desactivado porque nosotros manejamos la
    // sensibilidad VISUAL sin alterar la dinamica de la musica.
    const stream =
      await navigator.mediaDevices.getUserMedia(
      {
        audio:
        {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        },

        video: false
      });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    await audioContext.resume();


    sampleRate =
      audioContext.sampleRate;


    const source =
      audioContext.createMediaStreamSource(stream);


    analyser =
      audioContext.createAnalyser();


    // 8192 puntos:
    //
    // A 48 kHz:
    // 48000 / 8192 = ~5.86 Hz por bin.
    //
    // Esto mejora mucho la lectura de 40 / 63 / 100 Hz.
    analyser.fftSize = 8192;


    // Permitimos ver señales muy pequeñas.
    analyser.minDecibels = -110;

    analyser.maxDecibels = -5;


    // Poco smoothing interno.
    // El movimiento lo controlamos nosotros.
    analyser.smoothingTimeConstant = 0.06;


    source.connect(analyser);


    // Float32 para obtener dB reales de cada bin.
    freqData =
      new Float32Array(
        analyser.frequencyBinCount
      );


    timeData =
      new Float32Array(
        analyser.fftSize
      );


    micActive = true;

    activatedAt = performance.now();


    overlay.classList.add('hidden');


    live.textContent = 'MIC • LIVE';

    live.className = 'live on';


    requestAnimationFrame(render);
  }
  catch (err)
  {
    errorBox.textContent =
      'No se pudo abrir el micrófono:\n' +
      (
        err && err.message
          ? err.message
          : String(err)
      );
  }
}


document
  .getElementById('start')
  .addEventListener(
    'click',
    function(ev)
    {
      ev.stopPropagation();

      startMic();
    }
  );


// ============================================================================
// ANALISIS Y DIBUJO
// ============================================================================

function render()
{
  if (
    !micActive ||
    !analyser
  )
  {
    return;
  }


  // FFT en dB.
  analyser.getFloatFrequencyData(freqData);

  // Forma de onda temporal para RMS / peak general.
  analyser.getFloatTimeDomainData(timeData);


  const binHz =
    sampleRate /
    analyser.fftSize;


  // --------------------------------------------------------------------------
  // RMS GENERAL
  // --------------------------------------------------------------------------

  let sq = 0;

  let absPeak = 0;


  for (
    let i = 0;
    i < timeData.length;
    i++
  )
  {
    const v = timeData[i];

    sq += v * v;


    const a =
      Math.abs(v);


    if (
      a > absPeak
    )
    {
      absPeak = a;
    }
  }


  const rms =
    Math.sqrt(
      sq /
      timeData.length
    );


  const rmsDb =
    rms > 0
      ? Math.max(
          -90,
          20 * Math.log10(rms)
        )
      : -90;


  const peakDb =
    absPeak > 0
      ? Math.max(
          -90,
          20 * Math.log10(absPeak)
        )
      : -90;


  // --------------------------------------------------------------------------
  // FFT POR BANDA
  // --------------------------------------------------------------------------

  for (
    let b = 0;
    b < BANDS.length;
    b++
  )
  {
    const edges =
      bandEdges(b);


    const lowHz =
      edges[0];


    const highHz =
      edges[1];


    const i0 =
      Math.max(
        1,
        Math.floor(
          lowHz /
          binHz
        )
      );


    const i1 =
      Math.min(
        freqData.length - 1,
        Math.ceil(
          highHz /
          binHz
        )
      );


    // Trabajamos con:
    //
    // - pico de la banda, para no perder transitorios;
    // - potencia media, para que la barra tenga cuerpo.
    //
    let maxDb = -110;

    let powerSum = 0;

    let count = 0;


    for (
      let i = i0;
      i <= i1;
      i++
    )
    {
      let db =
        freqData[i];


      // Algunos navegadores pueden devolver -Infinity.
      if (
        !Number.isFinite(db)
      )
      {
        db = -110;
      }


      if (
        db > maxDb
      )
      {
        maxDb = db;
      }


      // Convertimos dB de amplitud a potencia relativa.
      powerSum +=
        Math.pow(
          10,
          db / 10
        );


      count++;
    }


    const avgPower =
      count > 0
        ? powerSum / count
        : 0;


    const avgDb =
      avgPower > 0
        ? 10 * Math.log10(avgPower)
        : -110;


    // Damos mas peso al pico que en la version anterior.
    //
    // Eso hace que golpes de bombo, caja, bajo, guitarra, etc.
    // se vean inmediatamente.
    let bandDb =
      avgDb * 0.30 +
      maxDb * 0.70;


    // Ganancia visual general.
    bandDb +=
      GLOBAL_VISUAL_GAIN_DB;


    // Compensacion por respuesta tipica de microfono de celular.
    bandDb +=
      BAND_COMPENSATION_DB[b];


    // Si estamos en silencio real, evitamos llenar la pantalla con
    // ruido ambiental amplificado.
    if (
      rmsDb <
      SILENCE_GATE_DB
    )
    {
      bandDb -=
        18;
    }


    targets[b] =
      dbToNorm(
        bandDb
      );
  }


  // --------------------------------------------------------------------------
  // PEAK GENERAL
  // --------------------------------------------------------------------------

  if (
    peakDb >
    globalPeakDb
  )
  {
    globalPeakDb =
      peakDb;
  }
  else
  {
    globalPeakDb =
      Math.max(
        -90,
        globalPeakDb - 0.12
      );
  }


  // --------------------------------------------------------------------------
  // TEXTOS
  // --------------------------------------------------------------------------

  document
    .getElementById('db')
    .textContent =
      rmsDb.toFixed(1) +
      ' dBFS';


  document
    .getElementById('status')
    .textContent =
      'PEAK: ' +
      globalPeakDb.toFixed(1) +
      ' dBFS';


  document
    .getElementById('source')
    .textContent =
      'SOURCE: MIC   ' +
      Math.round(
        sampleRate / 1000
      ) +
      ' kHz';


  // --------------------------------------------------------------------------
  // BARRAS
  // --------------------------------------------------------------------------

  for (
    let b = 0;
    b < BANDS.length;
    b++
  )
  {
    const k =
      targets[b] >
      shown[b]
        ? ATTACK
        : RELEASE;


    shown[b] +=
      (
        targets[b] -
        shown[b]
      ) *
      k;


    if (
      shown[b] >
      peaks[b]
    )
    {
      peaks[b] =
        shown[b];
    }
    else
    {
      peaks[b] =
        Math.max(
          0,
          peaks[b] -
          PEAK_RELEASE
        );
    }


    const onCount =
      Math.round(
        shown[b] *
        SEGMENTS
      );


    const peakIndex =
      Math.max(
        0,
        Math.min(
          SEGMENTS - 1,
          Math.round(
            peaks[b] *
            SEGMENTS
          ) - 1
        )
      );


    for (
      let s = 0;
      s < SEGMENTS;
      s++
    )
    {
      let cls =
        'seg';


      if (
        s <
        onCount
      )
      {
        if (
          s >=
          SEGMENTS - 2
        )
        {
          cls +=
            ' on red';
        }
        else if (
          s >=
          SEGMENTS - 5
        )
        {
          cls +=
            ' on amber';
        }
        else
        {
          cls +=
            ' on cyan';
        }
      }


      if (
        s === peakIndex &&
        peaks[b] > 0.035
      )
      {
        cls +=
          ' peak';
      }


      barSegments[b][s].className =
        cls;
    }
  }


  requestAnimationFrame(
    render
  );
}


// ============================================================================
// NAVEGACION AL ESP
// ============================================================================

document
  .getElementById('panel')
  .addEventListener(
    'click',
    function()
    {
      if (
        !micActive
      )
      {
        return;
      }


      // Evita que el mismo toque que habilito el microfono
      // nos lleve inmediatamente al ESP.
      if (
        performance.now() -
        activatedAt <
        800
      )
      {
        return;
      }


      location.href =
        CONTROL_URL;
    }
  );

</script>
</body>
</html>
